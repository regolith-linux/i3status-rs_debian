[theme]
theme = "semi-native"

[icons]
icons = "awesome4"

# The active keyboard layout, updated as soon as it changes, as the
# keyboard-layout blocklet shows it in the X11 session. A left click opens
# the keyboard settings, where input sources are added and removed.
[[block]]
block = "keyboard_layout"
# Only with a keyboard that has a layout: without one (a headless or remote
# session) the block shows "Failed to get current input". Checked when the
# bar starts.
if_command = "swaymsg -t get_inputs -r | grep -q '\"xkb_active_layout_name\": *\"'"
driver = "sway"
format = " \uf11c $layout "
[[block.click]]
button = "left"
cmd = "regolith-control-center keyboard"

[[block]]
block = "net"

# CPU usage, also shown by the X11 session's bar
[[block]]
block = "cpu"
interval = 5
format = " $icon $utilization.eng(w:2) "

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
alert_unit = "GB"
interval = 20
warning = 20.0
alert = 10.0
format = " $icon $available.eng(w:2) "

[[block]]
block = "memory"
format = " $icon $mem_total_used_percents.eng(w:2) "
format_alt = " $icon_swap $swap_used_percents.eng(w:2) "

[[block]]
block = "battery"
# Only on machines with a battery: without one, UPower's DisplayDevice still
# exists and the block shows an empty red battery. Checked when the bar starts.
if_command = "upower --enumerate | grep -q /battery_"
format = " $icon\u2009 $percentage "
missing_format = ""
device = "DisplayDevice"
driver = "upower"
[[block.click]]
button = "left"
cmd = "regolith-control-center power"

[[block]]
block = "rofication"
# Only while Rofication is installed: without its daemon the block shows
# "Failed to connect to socket". Checked when the bar starts.
if_command = "command -v rofication-daemon"
interval = 1
socket_path = "/tmp/rofi_notification_daemon"
[[block.click]]
button = "left"
cmd = "ilia -p notifications"

[[block]]
block = "sound"
driver = "pulseaudio"

[[block.click]]
button = "left"
cmd = "regolith-control-center sound"

[[block]]
block = "time"
interval = 5
format = "\uf073 $timestamp.datetime(f:'%a-%d/%m/%y')"
[[block.click]]
button = "left"
cmd = "regolith-control-center datetime"

[[block]]
block = "time"
interval = 5
format = "$icon $timestamp.datetime(f:'%R')"
[[block.click]]
button = "left"
cmd = "regolith-control-center datetime"


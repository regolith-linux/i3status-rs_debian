theme = "semi-native"
icons = "awesome"

[[block]]
block = "net"

# CPU usage, also shown by the X11 session's bar
[[block]]
block = "cpu"
interval = 5

[[block]]
block = "disk_space"
path = "/"
info_type = "used"
format = "{icon} {percentage}"
alert_absolute = true
unit = "GB"
alert = 50
warning = 40

[[block]]
block = "memory"
display_type = "memory"
format_mem = "{mem_used_percents}"
format_swap = "{swap_used_percents}"

[[block]]
block = "battery"
# Only on machines with a battery: without one the block puts the whole bar in
# an error state. Checked when the bar starts.
if_command = "upower --enumerate | grep -q /battery_"
driver = "upower"
device = "DisplayDevice"
format = "{percentage}"
full_format = "{percentage}"
hide_missing = true

[[block]]
block = "rofication"
# Only while Rofication is installed: without its daemon the block shows
# "Failed to connect to socket". Checked when the bar starts.
if_command = "command -v rofication-daemon"
interval = 1
socket_path = "/tmp/rofi_notification_daemon"

[[block]]
block = "sound"
driver = "pulseaudio"

[[block]]
block = "time"
interval = 5
format = "%d/%m %R"


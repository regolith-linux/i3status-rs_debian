[theme]
theme = "semi-native"

[icons]
icons = "awesome4"

[[block]]
block = "net"

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
alert_unit = "GB"
interval = 20
warning = 20.0
alert = 10.0
format = " $icon $available.eng(w:2) "

[[block]]
block = "memory"
format = " $icon $mem_total_used_percents.eng(w:2) "
format_alt = " $icon_swap $swap_used_percents.eng(w:2) "

[[block]]
block = "battery"
format = " $icon\u2009 $percentage "
missing_format = ""
device = "DisplayDevice"
driver = "upower"

[[block]]
block = "rofication"
# Only while Rofication is installed: without its daemon the block shows
# "Failed to connect to socket". Checked when the bar starts.
if_command = "command -v rofication-daemon"
interval = 1
socket_path = "/tmp/rofi_notification_daemon"
[[block.click]]
button = "left"
cmd = "ilia -p notifications"

[[block]]
block = "sound"
driver = "pulseaudio"

[[block.click]]
button = "left"
cmd = "regolith-control-center sound"

# Date and time, chosen like the X11 session's bar: the time follows
# Settings > Date & Time > Time Format (12h/24h), and the Xresource
# i3xrocks.date.format2 (a date(1) format) replaces both when it is set.
[[block]]
block = "custom"
command = "/usr/libexec/i3status-rs/regolith-bar-time date '%a-%d/%m/%y'"
json = true
hide_when_empty = true
interval = 5
format = "\uf073 $text.pango-str()"

[[block]]
block = "custom"
command = "/usr/libexec/i3status-rs/regolith-bar-time time"
json = true
interval = 5
format = "$icon $text.pango-str()"


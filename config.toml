theme = "semi-native"
icons = "awesome"

[[block]]
block = "net"

[[block]]
block = "disk_space"
path = "/"
info_type = "used"
format = "{icon} {percentage}"
alert_absolute = true
unit = "GB"
alert = 50
warning = 40

[[block]]
block = "memory"
display_type = "memory"
format_mem = "{mem_used_percents}"
format_swap = "{swap_used_percents}"

# Uncomment below to enable battery
# [[block]]
# block = "battery"
# interval = 10
# format = " {percentage}"
# full_format = " {percentage}"
# hide_missing = true
# driver = "sysfs"

[[block]]
block = "rofication"
# Only while Rofication is installed: without its daemon the block shows
# "Failed to connect to socket". Checked when the bar starts.
if_command = "command -v rofication-daemon"
interval = 1
socket_path = "/tmp/rofi_notification_daemon"

[[block]]
block = "sound"
driver = "pulseaudio"

# Date and time, chosen like the X11 session's bar: the time follows
# Settings > Date & Time > Time Format (12h/24h), and the Xresource
# i3xrocks.date.format2 (a date(1) format) replaces both when it is set.
[[block]]
block = "custom"
command = "/usr/libexec/i3status-rs/regolith-bar-time datetime '%d/%m'"
json = true
interval = 5

